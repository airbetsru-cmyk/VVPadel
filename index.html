    function resizeCanvas() {
      width = canvas.width = window.innerWidth;

    const balls = [];

    class FallingBall {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : -30;
        this.radius = Math.random() * 7 + 7;
        this.speedY = Math.random() * 0.9 + 0.4;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.35 + 0.15;
        this.rotation = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.02;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.spin;
        if (this.y - this.radius > height) this.reset(false);
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ccff00';
        ctx.shadowColor = '#ccff00';
        ctx.shadowBlur = 10;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.5, 0, this.radius * 0.7, -Math.PI * 0.45, Math.PI * 0.45);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1, this.radius * 0.16);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.radius * 0.5, 0, this.radius * 0.7, Math.PI * 0.55, Math.PI * 1.45);
        ctx.stroke();

        ctx.restore();
      }
    }

    for (let i = 0; i < ballCount; i++) balls.push(new FallingBall());

    function animateBalls() {
      ctx.clearRect(0, 0, width, height);
      balls.forEach(ball => { ball.update(); ball.draw(); });

    async function sendChatMessage(matchId) {
      const input = document.getElementById('chat_input');
      const text = input.value.trim();
      if (!text) return;

      const newMsg = {
        match_id: matchId,
        user_id: tgUser.id,
        sender_name: tgUser.first_name || 'Игрок',
        message_text: text,
        created_at: new Date().toISOString()
      };

      if (!localMatchMessages[matchId]) localMatchMessages[matchId] = [];
      localMatchMessages[matchId].push(newMsg);

      try {
        await supabaseClient.from('match_messages').insert([newMsg]);
      } catch(e){}

      input.value = '';
      renderMatchDetails(matchId);
    }

    function renderNameInputs() {
      const count = parseInt(document.getElementById('quick_player_count').value) || 4;
      const container = document.getElementById('names-container');
      let html = '<label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Имена участников:</label>';

    function startQuickAmericano() {
      const count = parseInt(document.getElementById('quick_player_count').value) || 4;
      const cycles = parseInt(document.getElementById('quick_cycles').value) || 1;
      const players = [];

      for (let i = 1; i <= count; i++) {
        const inputName = document.getElementById(`player_name_${i}`).value.trim();
        players.push({ id: i - 1, name: inputName || `Игрок ${i}` });
      }

      const baseRotation = AMERICANO_ROTATIONS[count];
      const rounds = [];
      let roundIdCounter = 1;
      const roundsPerCycle = baseRotation[baseRotation.length - 1].round;

      for (let c = 1; c <= cycles; c++) {
        baseRotation.forEach((r) => {
          rounds.push({
            id: roundIdCounter++,
            cycle: c,
            round: r.round + (c - 1) * roundsPerCycle,
            court: r.court,
            team_a: [r.a[0], r.a[1]],
            team_b: [r.b[0], r.b[1]],
            score_a: 0,
            score_b: 0,
            completed: false
          });
        });
      }

      localAmericanoState = { players, rounds, cycles };
      localStorage.setItem('quick_americano_state', JSON.stringify(localAmericanoState));
      renderQuickAmericano();
    }

    function renderQuickAmericanoBoard(container) {
      const { players, rounds, cycles } = localAmericanoState;

      const leaderboard = players.map(p => ({ ...p, points: 0, matches: 0 }));

      rounds.forEach(r => {
        if (r.completed) {
          const sa = parseInt(r.score_a) || 0;
          const sb = parseInt(r.score_b) || 0;
          r.team_a.forEach(pIdx => { leaderboard[pIdx].points += sa; leaderboard[pIdx].matches++; });
          r.team_b.forEach(pIdx => { leaderboard[pIdx].points += sb; leaderboard[pIdx].matches++; });
        }
      });

      const sortedLeaderboard = [...leaderboard].sort((a, b) => b.points - a.points);

      let leaderboardHtml = sortedLeaderboard.map((item, index) => {
        let cardStyle = "bg-slate-900/60 border-white/5";
        let badge = `<span class="text-slate-400 font-bold">${index + 1} место</span>`;

        if (index === 0) {
          cardStyle = "bg-gradient-to-r from-amber-500/20 to-yellow-600/10 border-amber-500/50 shadow-lg shadow-amber-500/10";
          badge = `<span class="text-amber-400 font-black">🥇 1-е МЕСТО</span>`;
        } else if (index === 1) {
          cardStyle = "bg-gradient-to-r from-slate-300/20 to-slate-400/10 border-slate-300/40";
          badge = `<span class="text-slate-200 font-black">🥈 2-е МЕСТО</span>`;
        } else if (index === 2) {
          cardStyle = "bg-gradient-to-r from-amber-700/20 to-amber-800/10 border-amber-700/40";
          badge = `<span class="text-amber-600 font-black">🥉 3-е МЕСТО</span>`;
        }

        return `
          <div class="flex items-center justify-between p-2.5 border rounded-2xl ${cardStyle}">
            <div class="flex items-center gap-2 text-xs">
              ${badge}
              <span class="font-bold text-white">${item.name}</span>
            </div>
            <span class="font-black text-purple-300 bg-purple-500/20 px-2.5 py-1 rounded-full text-xs">${item.points} PTS</span>
          </div>
        `;
      }).join('');

      let roundsHtml = rounds.map(r => {
        const pA1 = players[r.team_a[0]]?.name;
        const pA2 = players[r.team_a[1]]?.name;
        const pB1 = players[r.team_b[0]]?.name;
        const pB2 = players[r.team_b[1]]?.name;

        return `
          <div class="p-3 border border-slate-800/80 rounded-2xl bg-slate-900/50 space-y-2 text-xs">
            <div class="flex justify-between items-center text-slate-400 font-semibold">
              <span>Круг ${r.cycle} • Игра #${r.round} ${r.court ? `(Корт #${r.court})` : ''}</span>
              ${r.completed ? '<span class="text-emerald-400 font-black">Завершён</span>' : '<span class="text-amber-400 font-semibold">Ожидает</span>'}
            </div>
            <div class="flex items-center justify-between gap-1.5">
              <div class="flex-1 text-center font-bold text-white">${pA1} / ${pA2}</div>
              
              <div class="flex items-center gap-1">
                <input type="number" id="quick_score_a_${r.id}" value="${r.score_a || ''}" placeholder="0" class="w-10 text-center p-1.5 border border-slate-700 rounded-xl font-black bg-slate-950 text-white text-sm focus:border-purple-500 focus:outline-none">
                <span class="font-black text-slate-500">:</span>
                <input type="number" id="quick_score_b_${r.id}" value="${r.score_b || ''}" placeholder="0" class="w-10 text-center p-1.5 border border-slate-700 rounded-xl font-black bg-slate-950 text-white text-sm focus:border-purple-500 focus:outline-none">
                
                <button onclick="saveQuickScore(${r.id})" class="ml-1 px-2.5 py-1.5 bg-purple-600 text-white rounded-xl font-black text-xs hover:bg-purple-500 btn-3d">
                  ОК
                </button>
              </div>

              <div class="flex-1 text-center font-bold text-white">${pB1} / ${pB2}</div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-4 rounded-2xl text-white flex justify-between items-center shadow-lg shadow-purple-500/20">
            <div>
              <h2 class="text-base font-black uppercase tracking-wide">🏆 Калькулятор</h2>
              <p class="text-xs opacity-80">Всего игр: ${rounds.length} (${cycles || 1} ${cycles > 1 ? 'круга' : 'круг'})</p>
            </div>
            <button onclick="resetQuickAmericano()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold btn-3d">Сбросить</button>
          </div>

          <div class="space-y-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Общий Лидерборд</h3>
            ${leaderboardHtml}
          </div>

          <div class="space-y-2 pt-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Матчи и Счёт</h3>
            ${roundsHtml}
          </div>
        </div>
      `;
    }

    function saveQuickScore(roundId) {
      const inputA = document.getElementById(`quick_score_a_${roundId}`);
      const inputB = document.getElementById(`quick_score_b_${roundId}`);

      const scoreA = parseInt(inputA.value) || 0;
      const scoreB = parseInt(inputB.value) || 0;

      const round = localAmericanoState.rounds.find(r => r.id === roundId);
      if (round) {
        round.score_a = scoreA;
        round.score_b = scoreB;
        round.completed = (scoreA > 0 || scoreB > 0);
        
        localStorage.setItem('quick_americano_state', JSON.stringify(localAmericanoState));
        renderQuickAmericanoBoard(document.getElementById('main-content'));
      }
    }

    function resetQuickAmericano() {
      if (confirm('Начать новый турнир? Текущий счёт будет сброшен.')) {
        localAmericanoState = null;
        localStorage.removeItem('quick_americano_state');
        renderQuickAmericano();
      }
    }

          </div>

          <!-- Национальный рейтинг -->
          <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-white/5 space-y-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">${t('nationalRanking')}</h3>
            <div class="divide-y divide-white/5">
              ${leaderboardRows.length > 0 ? leaderboardRows : '<p class="text-xs text-slate-500 py-2">Рейтинг формируется...</p>'}
            </div>
          </div>
        </div>
      `;
    }

    async function saveProfileData(e) {
      e.preventDefault();
      const skill = parseFloat(document.getElementById('edit_skill_level').value) || 2.5;
      const side = document.getElementById('edit_preferred_side').value;
      const phone = document.getElementById('edit_phone').value.trim();

      try {
        const updateObj = {
          id: tgUser.id,
          first_name: tgUser.first_name || 'Игрок',
          last_name: tgUser.last_name || null,
          username: tgUser.username || null,
          skill_level: skill,
          preferred_side: side,
          phone: phone,
          updated_at: new Date()
        };

        await supabaseClient.from('profiles').upsert(updateObj);
        currentUserProfile = { ...currentUserProfile, ...updateObj };
        alert('Профиль сохранен!');
        renderProfileTab();
      } catch(err) {
        alert('Ошибка сохранения: ' + err.message);
      }
    }

    async function joinMatch(matchId, nextSlot) {
      try {
        await syncUserProfile();
        await supabaseClient.from('match_players').insert([{ match_id: matchId, user_id: tgUser.id, slot_number: nextSlot }]);
        renderMatchDetails(matchId);
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    async function leaveMatch(matchId) {
      try {
        await supabaseClient.from('match_players').delete().eq('match_id', matchId).eq('user_id', tgUser.id);
        renderMatchDetails(matchId);
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    function copyShareLink(url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        if (tg?.showAlert) tg.showAlert('Ссылка скопирована!');
        else alert('Ссылка скопирована!');
      } else prompt('Скопируйте ссылку:', url);
    }

    initApp();
  </script>
</body>
</html>
