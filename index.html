<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Padel Moldova</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="p-4 text-gray-900 font-sans pb-12">

  <div id="app" class="max-w-md mx-auto space-y-4">
    <!-- Шапка -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-emerald-700">Padel Moldova 🎾</h1>
          <p id="user-greeting" class="text-xs text-gray-500">Загрузка профиля...</p>
        </div>
        <span id="user-badge" class="px-2 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full">Player</span>
      </div>

      <!-- Вкладки переключения режимов -->
      <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-xl text-xs font-bold">
        <button id="tab-booking" onclick="switchTab('booking')" class="py-2 rounded-lg bg-white shadow text-emerald-700">
          🎾 Запись на корт
        </button>
        <button id="tab-americano" onclick="switchTab('americano')" class="py-2 rounded-lg text-gray-500 hover:text-gray-900">
          🏆 Быстрый Американо
        </button>
      </div>
    </div>

    <!-- Блок ошибок -->
    <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-xs font-mono break-all"></div>

    <!-- Главный контент -->
    <div id="main-content" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 min-h-[250px]">
      <div class="flex justify-center items-center py-12 text-gray-400">Загрузка приложения...</div>
    </div>
  </div>

  <script>
    // --- ВСТАВЬТЕ ВАШИ ДАННЫЕ СУПАБЕЙС НИЖЕ ---
    const SUPABASE_URL = 'https://ppdxzmcycwhtuhebaduh.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_KRbMwTasNQpUqQ7gKihOxg_KKQiUbm-'; 
    const shareBotUsername = 'VVPadel_bot';

    // Матрицы ротации для Американо
    const AMERICANO_ROTATIONS = {
      4: [
        { round: 1, court: 1, a: [0, 1], b: [2, 3] },
        { round: 2, court: 1, a: [0, 2], b: [1, 3] },
        { round: 3, court: 1, a: [0, 3], b: [1, 2] }
      ],
      6: [
        { round: 1, court: 1, a: [0, 1], b: [2, 3] },
        { round: 2, court: 1, a: [0, 4], b: [2, 5] },
        { round: 3, court: 1, a: [1, 4], b: [3, 5] },
        { round: 4, court: 1, a: [0, 2], b: [1, 5] },
        { round: 5, court: 1, a: [0, 3], b: [4, 5] }
      ],
      8: [
        { round: 1, court: 1, a: [0, 1], b: [2, 3] }, { round: 1, court: 2, a: [4, 5], b: [6, 7] },
        { round: 2, court: 1, a: [0, 2], b: [4, 6] }, { round: 2, court: 2, a: [1, 5], b: [3, 7] },
        { round: 3, court: 1, a: [0, 3], b: [5, 7] }, { round: 3, court: 2, a: [1, 4], b: [2, 6] },
        { round: 4, court: 1, a: [0, 4], b: [3, 6] }, { round: 4, court: 2, a: [1, 7], b: [2, 5] },
        { round: 5, court: 1, a: [0, 5], b: [1, 6] }, { round: 5, court: 2, a: [2, 7], b: [3, 4] },
        { round: 6, court: 1, a: [0, 6], b: [2, 5] }, { round: 6, court: 2, a: [1, 3], b: [4, 7] },
        { round: 7, court: 1, a: [0, 7], b: [1, 2] }, { round: 7, court: 2, a: [3, 5], b: [4, 6] }
      ]
    };

    let activeTab = 'booking';
    let localAmericanoState = null;

    function showError(msg) {
      if (!msg || msg === 'Script error.') return;
      const box = document.getElementById('error-box');
      box.classList.remove('hidden');
      box.innerHTML = `<strong>Инфо:</strong> ${msg}`;
    }

    const tg = window.Telegram?.WebApp;
    if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

    const tgUser = tg?.initDataUnsafe?.user || {
      id: Math.floor(Math.random() * 1000000),
      first_name: 'Игрок',
      last_name: ''
    };

    function getStartParam() {
      if (tg?.initDataUnsafe?.start_param) return tg.initDataUnsafe.start_param;
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('tgWebAppStartParam') || urlParams.get('startapp') || urlParams.get('start');
    }

    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
      showError('Ошибка базы: ' + e.message);
    }

    async function initApp() {
      document.getElementById('user-greeting').innerText = `${tgUser.first_name} ${tgUser.last_name || ''}`.trim();
      
      // Загрузка сохранённого турнира Американо из локальной памяти
      const savedState = localStorage.getItem('quick_americano_state');
      if (savedState) {
        try { localAmericanoState = JSON.parse(savedState); } catch(e){}
      }

      const startParam = getStartParam();
      if (startParam) {
        await renderMatchDetails(startParam);
      } else {
        renderCreateMatchForm();
      }

      syncUserProfile();
    }

    function switchTab(tab) {
      activeTab = tab;
      const btnBooking = document.getElementById('tab-booking');
      const btnAmericano = document.getElementById('tab-americano');

      if (tab === 'booking') {
        btnBooking.className = 'py-2 rounded-lg bg-white shadow text-emerald-700 font-bold';
        btnAmericano.className = 'py-2 rounded-lg text-gray-500 hover:text-gray-900 font-bold';
        const startParam = getStartParam();
        if (startParam) renderMatchDetails(startParam);
        else renderCreateMatchForm();
      } else {
        btnAmericano.className = 'py-2 rounded-lg bg-white shadow text-purple-700 font-bold';
        btnBooking.className = 'py-2 rounded-lg text-gray-500 hover:text-gray-900 font-bold';
        renderQuickAmericano();
      }
    }

    async function syncUserProfile() {
      if (!supabaseClient) return;
      try {
        await supabaseClient.from('profiles').upsert({
          id: tgUser.id,
          first_name: tgUser.first_name || 'Игрок',
          last_name: tgUser.last_name || null,
          username: tgUser.username || null,
          updated_at: new Date()
        });
      } catch (err) {}
    }

    // --- 1. РЕЖИМ БРОНИРОВАНИЯ И СЛОТОВ ---
    function renderCreateMatchForm() {
      const container = document.getElementById('main-content');
      container.innerHTML = `
        <h2 class="text-base font-bold mb-4 text-gray-800">Создать новую игру</h2>
        <form id="create-form" class="space-y-3" onsubmit="handleCreateMatch(event)">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Локация / Корт</label>
            <input type="text" id="custom_location" required value="Padel Club Chisinau" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Мест</label>
              <select id="max_players" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium">
                <option value="4">4 игрока (2х2)</option>
                <option value="6">6 игроков (Americano)</option>
                <option value="8">8 игроков (2 корта)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Формат</label>
              <select id="match_type" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium">
                <option value="friendly">Дружеский</option>
                <option value="competitive">Рейтинговый</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Дата и время</label>
              <input type="datetime-local" id="scheduled_at" required class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Цена с игрока (MDL)</label>
              <input type="number" id="price_per_player" value="150" min="0" step="10" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Заметки / Пожелания</label>
            <input type="text" id="notes" placeholder="Мячи свои, уровень 2.5+" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
          </div>

          <button type="submit" id="submit-btn" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 text-sm mt-2">
            Сформировать ссылку на игру
          </button>
        </form>
      `;

      const defaultTime = new Date(Date.now() + 2 * 3600 * 1000).toISOString().slice(0, 16);
      document.getElementById('scheduled_at').value = defaultTime;
    }

    async function handleCreateMatch(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      try {
        await syncUserProfile();

        const matchData = {
          creator_id: tgUser.id,
          custom_location: document.getElementById('custom_location').value,
          max_players: parseInt(document.getElementById('max_players').value),
          match_type: document.getElementById('match_type').value,
          scheduled_at: new Date(document.getElementById('scheduled_at').value).toISOString(),
          price_per_player: parseFloat(document.getElementById('price_per_player').value) || 0,
          notes: document.getElementById('notes').value
        };

        const { data: match, error } = await supabaseClient.from('matches').insert([matchData]).select().single();
        if (error) throw error;

        await supabaseClient.from('match_players').insert([{
          match_id: match.id,
          user_id: tgUser.id,
          slot_number: 1
        }]);

        renderMatchDetails(match.id);
      } catch (err) {
        showError('Ошибка создания: ' + err.message);
        btn.disabled = false;
      }
    }

    async function renderMatchDetails(matchId) {
      const container = document.getElementById('main-content');
      container.innerHTML = `<div class="text-center py-8 text-gray-400">Загрузка информации...</div>`;

      try {
        const { data: match } = await supabaseClient.from('matches').select('*').eq('id', matchId).maybeSingle();
        if (!match) {
          container.innerHTML = `<div class="text-center py-6 text-red-500">Игра не найдена.</div>`;
          return;
        }

        const { data: rawPlayers } = await supabaseClient.from('match_players').select('*, profiles(*)').eq('match_id', matchId);
        const players = rawPlayers || [];

        const isJoined = players.some(p => String(p.user_id) === String(tgUser.id));
        const isFull = players.length >= match.max_players;

        const dateStr = new Date(match.scheduled_at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const shareUrl = `https://t.me/${shareBotUsername}/app?startapp=${match.id}`;

        let slotsHtml = '';
        for (let i = 1; i <= match.max_players; i++) {
          const p = players.find(item => item.slot_number === i || (!item.slot_number && players.indexOf(item) === i - 1));
          if (p) {
            const name = p.profiles?.first_name || (String(p.user_id) === String(tgUser.id) ? tgUser.first_name : 'Игрок');
            slotsHtml += `<div class="flex items-center justify-between p-2.5 bg-emerald-50 border border-emerald-100 rounded-xl">
              <span class="text-xs font-semibold text-emerald-900">Слот #${i}: ${name}</span>
              <span class="text-[10px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full">Занят</span>
            </div>`;
          } else {
            slotsHtml += `<div class="p-2.5 bg-gray-50 border border-dashed border-gray-300 rounded-xl text-gray-400 text-xs">Слот #${i}: Свободно</div>`;
          }
        }

        container.innerHTML = `
          <div class="space-y-4">
            <div>
              <div class="flex justify-between items-start">
                <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-[11px] font-bold uppercase rounded">${match.match_type}</span>
                <span class="text-xs font-bold text-emerald-700">${match.price_per_player} MDL / чел</span>
              </div>
              <h2 class="text-lg font-bold mt-1 text-gray-900">${match.custom_location}</h2>
              <p class="text-xs text-gray-500">📅 ${dateStr}</p>
            </div>

            <div class="border-t pt-3">
              <h3 class="text-xs font-bold text-gray-700 mb-2">Участники (${players.length}/${match.max_players})</h3>
              <div class="space-y-1.5">${slotsHtml}</div>
            </div>

            <div class="space-y-2 pt-2">
              ${!isJoined && !isFull ? `<button onclick="joinMatch('${match.id}',${players.length + 1})" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm">Занять слот</button>` : ''}
              ${isJoined ? `<button onclick="leaveMatch('${match.id}')" class="w-full py-2 bg-red-50 text-red-600 font-semibold rounded-xl text-xs">Покинуть игру</button>` : ''}
              <button onclick="copyShareLink('${shareUrl}')" class="w-full py-2.5 bg-gray-100 text-gray-800 font-semibold rounded-xl text-xs">📋 Скопировать ссылку на игру</button>
            </div>
          </div>
        `;
      } catch (err) {
        showError('Ошибка загрузки: ' + err.message);
      }
    }

    // --- 2. РЕЖИМ «БЫСТРЫЙ АМЕРИКАНО» (АВТОНОМНЫЙ КАЛЬКУЛЯТОР) ---
    function renderQuickAmericano() {
      const container = document.getElementById('main-content');

      // Если турнир уже запущен — показываем таблицу и сетку
      if (localAmericanoState && localAmericanoState.rounds) {
        renderQuickAmericanoBoard(container);
        return;
      }

      // Если турнир ещё не запущен — показываем форму с ручным вводом имён
      container.innerHTML = `
        <h2 class="text-base font-bold mb-2 text-purple-900">🏆 Быстрый Американо</h2>
        <p class="text-xs text-gray-500 mb-4">Введите имена игроков для моментальной генерации сетки и подсчёта мест.</p>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Количество участников</label>
            <select id="quick_player_count" onchange="renderNameInputs()" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-medium">
              <option value="4">4 игрока (1 корт)</option>
              <option value="6">6 игроков (1 корт)</option>
              <option value="8">8 игроков (2 корта)</option>
            </select>
          </div>

          <div id="names-container" class="space-y-2 pt-2">
            <!-- Сюда сгенерируются поля ввода имён -->
          </div>

          <button onclick="startQuickAmericano()" class="w-full py-3 bg-purple-600 text-white font-bold rounded-xl shadow-md hover:bg-purple-700 text-sm mt-4">
            🚀 Начать турнир и построить сетку
          </button>
        </div>
      `;

      renderNameInputs();
    }

    // Динамическая генерация полей ввода имён
    function renderNameInputs() {
      const count = parseInt(document.getElementById('quick_player_count').value) || 4;
      const container = document.getElementById('names-container');
      let html = '<label class="block text-xs font-medium text-gray-600 mb-1">Имена участников:</label>';

      for (let i = 1; i <= count; i++) {
        html += `
          <input type="text" id="player_name_${i}" value="Игрок ${i}" placeholder="Имя игрока ${i}" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white">
        `;
      }
      container.innerHTML = html;
    }

    // Запуск турнира
    function startQuickAmericano() {
      const count = parseInt(document.getElementById('quick_player_count').value) || 4;
      const players = [];

      for (let i = 1; i <= count; i++) {
        const inputName = document.getElementById(`player_name_${i}`).value.trim();
        players.push({
          id: i - 1,
          name: inputName || `Игрок ${i}`
        });
      }

      const rotation = AMERICANO_ROTATIONS[count];
      const rounds = rotation.map((r, index) => ({
        id: index + 1,
        round: r.round,
        court: r.court,
        team_a: [r.a[0], r.a[1]],
        team_b: [r.b[0], r.b[1]],
        score_a: 0,
        score_b: 0,
        completed: false
      }));

      localAmericanoState = { players, rounds };
      localStorage.setItem('quick_americano_state', JSON.stringify(localAmericanoState));
      renderQuickAmericano();
    }

    // Отрисовка интерактивной турнирной таблицы и сетки
    function renderQuickAmericanoBoard(container) {
      const { players, rounds } = localAmericanoState;

      // Подсчет очков
      const leaderboard = players.map(p => ({ ...p, points: 0, matches: 0 }));

      rounds.forEach(r => {
        if (r.completed) {
          const sa = parseInt(r.score_a) || 0;
          const sb = parseInt(r.score_b) || 0;

          r.team_a.forEach(pIdx => { leaderboard[pIdx].points += sa; leaderboard[pIdx].matches++; });
          r.team_b.forEach(pIdx => { leaderboard[pIdx].points += sb; leaderboard[pIdx].matches++; });
        }
      });

      // Сортировка по очкам
      const sortedLeaderboard = [...leaderboard].sort((a, b) => b.points - a.points);

      let leaderboardHtml = sortedLeaderboard.map((item, index) => {
        let badge = `${index + 1} место`;
        if (index === 0) badge = '🥇 1-е место';
        if (index === 1) badge = '🥈 2-е место';
        if (index === 2) badge = '🥉 3-е место';

        return `
          <div class="flex items-center justify-between p-2 border-b border-gray-100 text-xs">
            <span class="font-bold text-gray-800">${badge}: ${item.name}</span>
            <span class="font-extrabold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-full">${item.points} очков</span>
          </div>
        `;
      }).join('');

      let roundsHtml = rounds.map(r => {
        const pA1 = players[r.team_a[0]]?.name;
        const pA2 = players[r.team_a[1]]?.name;
        const pB1 = players[r.team_b[0]]?.name;
        const pB2 = players[r.team_b[1]]?.name;

        return `
          <div class="p-3 border border-gray-200 rounded-xl bg-gray-50 space-y-2 text-xs">
            <div class="flex justify-between items-center text-gray-500 font-bold">
              <span>Раунд ${r.round} ${r.court ? `(Корт #${r.court})` : ''}</span>
              ${r.completed ? '<span class="text-green-600 font-bold">Завершён</span>' : '<span class="text-amber-600">Ожидает</span>'}
            </div>
            <div class="flex items-center justify-between gap-1">
              <div class="flex-1 text-center font-semibold text-gray-800">${pA1} / ${pA2}</div>
              <div class="flex items-center gap-1">
                <input type="number" id="quick_score_a_${r.id}" value="${r.score_a}" oninput="updateQuickScore(${r.id})" class="w-10 text-center p-1 border rounded font-bold bg-white text-sm">
                <span>:</span>
                <input type="number" id="quick_score_b_${r.id}" value="${r.score_b}" oninput="updateQuickScore(${r.id})" class="w-10 text-center p-1 border rounded font-bold bg-white text-sm">
              </div>
              <div class="flex-1 text-center font-semibold text-gray-800">${pB1} / ${pB2}</div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-purple-600 to-indigo-700 p-4 rounded-xl text-white flex justify-between items-center">
            <div>
              <h2 class="text-base font-bold">🏆 Калькулятор Американо</h2>
              <p class="text-xs opacity-80">Введите очки — рейтинг пересчитается автоматически</p>
            </div>
            <button onclick="resetQuickAmericano()" class="px-2.5 py-1 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs font-semibold">Сброс</button>
          </div>

          <div class="bg-white border rounded-xl p-3 shadow-sm">
            <h3 class="text-xs font-bold text-gray-700 mb-2">Текущий Лидерборд</h3>
            ${leaderboardHtml}
          </div>

          <div class="space-y-2">
            <h3 class="text-xs font-bold text-gray-700">Матчи и Счёт</h3>
            ${roundsHtml}
          </div>
        </div>
      `;
    }

    // Автоматическое обновление очков "на лету" при вводе
    function updateQuickScore(roundId) {
      const scoreA = parseInt(document.getElementById(`quick_score_a_${roundId}`).value) || 0;
      const scoreB = parseInt(document.getElementById(`quick_score_b_${roundId}`).value) || 0;

      const round = localAmericanoState.rounds.find(r => r.id === roundId);
      if (round) {
        round.score_a = scoreA;
        round.score_b = scoreB;
        round.completed = (scoreA > 0 || scoreB > 0);
        localStorage.setItem('quick_americano_state', JSON.stringify(localAmericanoState));
        renderQuickAmericanoBoard(document.getElementById('main-content'));
      }
    }

    // Сброс и создание нового турнира
    function resetQuickAmericano() {
      if (confirm('Начать новый турнир? Текущий счёт будет сброшен.')) {
        localAmericanoState = null;
        localStorage.removeItem('quick_americano_state');
        renderQuickAmericano();
      }
    }

    async function joinMatch(matchId, nextSlot) {
      try {
        await syncUserProfile();
        await supabaseClient.from('match_players').insert([{ match_id: matchId, user_id: tgUser.id, slot_number: nextSlot }]);
        renderMatchDetails(matchId);
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    async function leaveMatch(matchId) {
      try {
        await supabaseClient.from('match_players').delete().eq('match_id', matchId).eq('user_id', tgUser.id);
        renderMatchDetails(matchId);
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    function copyShareLink(url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        if (tg?.showAlert) tg.showAlert('Ссылка скопирована!');
        else alert('Ссылка скопирована!');
      } else prompt('Скопируйте ссылку:', url);
    }

    initApp();
  </script>
</body>
</html>
